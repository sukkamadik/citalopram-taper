// ── Milestones ──────────────────────────────────────────────────────────────
function checkMilestones(phase, checkedAll, prevPhase) {
  const totalDone = Object.values(checkedAll).reduce((s,d) => s + Object.values(d).filter(Boolean).length, 0);
  const currentMg = TAPER[phase]?.from ?? 0;
  const milestones = [];

  if (totalDone === 1) milestones.push({ icon:'🌱', title:'Første dag afkrydset', sub:'Begyndelsen er den sværeste del.' });
  if (totalDone === 7 && phase === 0) milestones.push({ icon:'🗓️', title:'7 dage i træk', sub:'En hel uge. Rutinen er ved at sætte sig.' });
  if (phase > prevPhase && phase === 1) milestones.push({ icon:'✅', title:'Første fase fuldført', sub:'Du har bevist at du kan. Nu gentager du det.' });
  if (currentMg < 20 && TAPER[prevPhase]?.from >= 20) milestones.push({ icon:'📉', title:'Under 20 mg', sub:'Et mærkbart skridt nedad på kurven.' });
  if (currentMg < 15 && TAPER[prevPhase]?.from >= 15) milestones.push({ icon:'📉', title:'Under 15 mg', sub:'Mere end halvvejs mod 10 mg.' });
  if (currentMg < 10 && TAPER[prevPhase]?.from >= 10) milestones.push({ icon:'🎯', title:'Under 10 mg', sub:'Lavdosisterritorium. Det mærker kroppen.' });
  if (currentMg <= 12.5 && TAPER[prevPhase]?.from > 12.5) milestones.push({ icon:'🌗', title:'Halvvejs', sub:'25 mg til 0 mg — du er midt i det.' });
  if (currentMg < 5 && TAPER[prevPhase]?.from >= 5) milestones.push({ icon:'🌟', title:'Under 5 mg', sub:'Slutspurten begynder. Du er tæt på.' });
  if (currentMg < 1 && TAPER[prevPhase]?.from >= 1) milestones.push({ icon:'✨', title:'Under 1 mg', sub:'Mikrodoser. Næsten dér.' });
  if (phase >= TAPER.length && prevPhase < TAPER.length) milestones.push({ icon:'🏁', title:'0 mg — Fuldført!', sub:'Du gjorde det. Det her er en stor ting.' });

  return milestones;
}

function getDoses(from, to) {
  return Array.from({length:DAYS}, (_,i) => {
    const d = from - ((from-to)/(DAYS-1))*i;
    return Math.round(d*100)/100;
  });
}

function calc(tabletMg, waterMl, targetDose) {
  if (!tabletMg||!waterMl||tabletMg<=0||waterMl<=0) return null;
  const conc = tabletMg/waterMl;
  const discard = Math.round(((tabletMg-targetDose)/conc)*10)/10;
  const drink = Math.round((waterMl-discard)*10)/10;
  const actual = Math.round(drink*conc*100)/100;
  return { conc:Math.round(conc*1000)/1000, discard, drink, actual, diff:Math.abs(actual-targetDose) };
}

function load() {
  try { const s=localStorage.getItem(KEY); if(s) return JSON.parse(s); } catch(err) {}
  return { phase:0, checked:{}, themeKey:'light', tones:{informativ:true,varm:true,videnskabelig:true,fremadskuende:true}, startDate:'' };
}

function pickRandom(arr) { return arr[Math.floor(Math.random()*arr.length)]; }

function fmtMonth(date) {
  const mm = String(date.getMonth()+1).padStart(2,'0');
  const yy = String(date.getFullYear()).slice(-2);
  return `${mm}-${yy}`;
}

// ── Curve component ──────────────────────────────────────────────────────────
function TaperCurve({ checked, startDate, T }) {
  const W = 440, H = 200, PL = 40, PR = 20, PT = 16, PB = 32;
  const iW = W-PL-PR, iH = H-PT-PB;

  const totalDays = TAPER.length * DAYS;
  const maxMg = 25;

  function dayToX(day) { return PL + (day/totalDays)*iW; }
  function mgToY(mg)   { return PT + iH - (mg/maxMg)*iH; }

  // Build ALL daily points across all phases
  // Each phase has DAYS daily dose values from getDoses(from, to)
  const allDailyPts = [];
  TAPER.forEach((ph, pi) => {
    const doses = getDoses(ph.from, ph.to);
    doses.forEach((mg, di) => {
      allDailyPts.push({ day: pi*DAYS + di, mg });
    });
  });
  // Add final 0mg endpoint
  allDailyPts.push({ day: totalDays, mg: 0 });

  // Count total checked days to find current position
  const totalDone = Object.values(checked).reduce((s,d)=>s+Object.values(d).filter(Boolean).length,0);

  // Build past and future points - share exactly one point at junction
  const pastPts = allDailyPts.filter(p => p.day <= totalDone);
  if (pastPts.length === 0) pastPts.push(allDailyPts[0]);
  const lastPastDay = pastPts[pastPts.length-1].day;
  const futurePts = allDailyPts.filter(p => p.day >= lastPastDay);

  // Convert to SVG coords
  const toPt = p => ({ x: dayToX(p.day), y: mgToY(p.mg) });
  const toPath = pts => pts.map((p,i)=>`${i===0?'M':'L'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');

  const pastPoints   = pastPts.map(toPt);
  const futurePoints = futurePts.map(toPt);

  // Month labels on x-axis - skip to avoid overlap
  const monthLabels = [];
  if (startDate) {
    const s = new Date(startDate);
    const allMonths = [];
    let d = new Date(s); d.setDate(1); d.setMonth(d.getMonth()+1);
    let safety = 0;
    while (safety++ < 40) {
      const dayOffset = Math.round((d-s)/(1000*60*60*24));
      if (dayOffset > totalDays) break;
      allMonths.push({ x: dayToX(dayOffset), label: fmtMonth(d) });
      d.setMonth(d.getMonth()+1);
    }
    const step = Math.max(1, Math.ceil(allMonths.length / 8));
    allMonths.forEach((m,i) => { if (i % step === 0) monthLabels.push(m); });
  }

  // Milestone mg lines
  const mgLines = [20,15,10,5,1];

  return e('svg', { viewBox:`0 0 ${W} ${H}`, width:'100%', style:{display:'block'} },
    // Grid lines
    ...mgLines.map(mg => {
      const y = mgToY(mg);
      return e('g', { key:mg },
        e('line', { x1:PL, y1:y, x2:W-PR, y2:y, stroke:T.subBorder, strokeWidth:1, strokeDasharray:'3,3' }),
        e('text', { x:PL-4, y:y+4, textAnchor:'end', fontSize:9, fill:T.textFaint }, mg)
      );
    }),
    // Axes labels
    e('text', { x:PL-4, y:mgToY(25)+4, textAnchor:'end', fontSize:9, fill:T.textFaint }, '25'),
    e('text', { x:PL-4, y:mgToY(0)+4, textAnchor:'end', fontSize:9, fill:T.textFaint }, '0'),

    // Month labels
    ...monthLabels.map(({x,label},i) =>
      e('g', { key:i },
        e('line', { x1:x, y1:PT, x2:x, y2:H-PB+4, stroke:T.subBorder, strokeWidth:1 }),
        e('text', { x, y:H-PB+13, textAnchor:'middle', fontSize:8, fill:T.textFaint }, label)
      )
    ),

    // Future path (dashed)
    futurePoints.length > 1 && e('path', { d:toPath(futurePoints), fill:'none', stroke:T.chartFuture, strokeWidth:2, strokeDasharray:'5,4' }),
    // Past path (solid)
    pastPoints.length > 1 && e('path', { d:toPath(pastPoints), fill:'none', stroke:T.chartLine, strokeWidth:2.5 }),



    // Axes
    e('line', { x1:PL, y1:PT, x2:PL, y2:H-PB, stroke:T.textFaint, strokeWidth:1 }),
    e('line', { x1:PL, y1:H-PB, x2:W-PR, y2:H-PB, stroke:T.textFaint, strokeWidth:1 }),
  );
}


// ── Confetti ──────────────────────────────────────────────────────────────────
function useConfetti() {
  const canvasRef = useRef(null);
  const activeRef = useRef(false);

  function launch() {
    const canvas = canvasRef.current;
    if (!canvas || activeRef.current) return;
    activeRef.current = true;
    canvas.style.display = 'block';
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const ctx = canvas.getContext('2d');
    const colors = ['#16a34a','#60a5fa','#f472b6','#fbbf24','#a78bfa','#34d399','#f87171','#38bdf8'];
    const pieces = Array.from({length:120}, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * -canvas.height * 0.5 - 10,
      r: Math.random() * 7 + 4,
      color: colors[Math.floor(Math.random()*colors.length)],
      vx: (Math.random()-0.5) * 3,
      vy: Math.random() * 4 + 2,
      angle: Math.random()*Math.PI*2,
      va: (Math.random()-0.5) * 0.2,
      shape: Math.random() > 0.5 ? 'rect' : 'circle',
      w: Math.random() * 12 + 6,
      h: Math.random() * 6 + 4,
    }));
    let frame;
    const startTime = Date.now();
    function draw() {
      ctx.clearRect(0,0,canvas.width,canvas.height);
      const elapsed = Date.now() - startTime;
      const fade = Math.max(0, 1 - Math.max(0,(elapsed-2200)/800));
      pieces.forEach(p => {
        p.x += p.vx; p.y += p.vy + 0.05; p.angle += p.va;
        ctx.save();
        ctx.globalAlpha = fade * (p.y < canvas.height ? 1 : 0);
        ctx.translate(p.x, p.y);
        ctx.rotate(p.angle);
        ctx.fillStyle = p.color;
        if (p.shape === 'circle') {
          ctx.beginPath(); ctx.arc(0,0,p.r,0,Math.PI*2); ctx.fill();
        } else {
          ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
        }
        ctx.restore();
      });
      if (elapsed < 3000) { frame = requestAnimationFrame(draw); }
      else { canvas.style.display='none'; activeRef.current=false; }
    }
    draw();
    return () => { cancelAnimationFrame(frame); canvas.style.display='none'; activeRef.current=false; };
  }
  const ConfettiCanvas = e('canvas', { ref:canvasRef, style:{position:'fixed',inset:0,zIndex:999,pointerEvents:'none',display:'none'} });
  return { launch, ConfettiCanvas };
}

  const [tab,          setTab]       = useState('today');
  const [waterMl,      setWaterMl]   = useState('');
  const [tabletMg,     setTabletMg]  = useState('25');
  const [tabletLocked, setTabletLocked] = useState(true);
  const [themeKey,     setThemeKey]  = useState(init.themeKey || 'light');
  const [tones,        setTones]     = useState(init.tones || {informativ:true,varm:true,videnskabelig:true,fremadskuende:true});
  const [startDate,    setStartDate] = useState(init.startDate || '');
  const [showSettings, setShowSettings] = useState(false);
  const [milestone,    setMilestone] = useState(null);   // {icon,title,sub,msg,lookback}
  const prevPhaseRef = useRef(phase);

  const { launch: launchConfetti, ConfettiCanvas } = useConfetti();
  const T = THEMES[themeKey];
  const mono = { fontFamily:"'DM Mono', monospace" };

  const setPhase = (p) => { prevPhaseRef.current = phase; setPhaseRaw(p); };

  useEffect(() => { setWaterMl(String(TAPER[phase]?.suggestedWater || 25)); }, [phase]);
  useEffect(() => { document.body.style.background=T.bg; document.body.style.color=T.text; }, [themeKey]);
  useEffect(() => {
    try { localStorage.setItem(KEY, JSON.stringify({phase,checked,themeKey,tones,startDate})); } catch(err) {}
  }, [phase,checked,themeKey,tones,startDate]);

  // Show milestone/lookback on every phase change
  useEffect(() => {
    const prev = prevPhaseRef.current;
    if (phase === prev) return;
    const activeTones = Object.keys(tones).filter(k=>tones[k]);
    const tone = activeTones.length > 0 ? pickRandom(activeTones) : 'varm';
    const msgFn = pickRandom(MESSAGES[tone]);
    const totalDone = Object.values(checked).reduce((s,d)=>s+Object.values(d).filter(Boolean).length,0);
    const lookbackFn = pickRandom(LOOKBACKS);
    const mgFrom = TAPER[prev]?.from ?? 25;
    const mgNow  = TAPER[phase]?.from ?? 0;
    // Check for special milestone, otherwise use generic phase complete
    const ms = checkMilestones(phase, checked, prev);
    const base = ms.length > 0 ? ms[0] : {
      icon: '✅',
      title: `Fase ${prev+1} fuldført`,
      sub: `Du er nu på ${mgNow} mg.`,
    };
    setMilestone({
      ...base,
      msg: msgFn(phase+1, totalDone),
      lookback: lookbackFn(totalDone, mgFrom, mgNow),
    });
    launchConfetti();
  }, [phase]);

  const interval       = TAPER[phase] || TAPER[TAPER.length-1];
  const doses          = getDoses(interval.from, interval.to);
  const totalPhases    = TAPER.length;
  const checkedInPhase = Object.values(checked[phase]||{}).filter(Boolean).length;
  const phaseComplete  = checkedInPhase === DAYS;
  const todayIdx       = doses.findIndex((_,i)=>!checked[phase]?.[i]);
  const todayDose      = todayIdx>=0 ? doses[todayIdx] : null;
  const totalDone      = Object.values(checked).reduce((s,d)=>s+Object.values(d).filter(Boolean).length,0);
  const overallPct     = Math.round((totalDone/(totalPhases*DAYS))*100);
  const tMg = parseFloat(tabletMg)||25;
  const wMl = parseFloat(waterMl);

  const toggle = (day) => setChecked(prev=>({...prev,[phase]:{...(prev[phase]||{}),[day]:!(prev[phase]?.[day])}}));

  function Divider() { return e('div',{style:{height:1,background:T.divider}}); }

  function VerifyBox({targetDose,tabletMg,waterMl}) {
    const r=calc(tabletMg,waterMl,targetDose);
    if(!r) return null;
    const ok=r.diff<0.1, warn=r.diff<0.3;
    const col=ok?'#166534':warn?'#92400e':'#991b1b';
    const bg=ok?'#dcfce7':warn?'#fef3c7':'#fee2e2';
    const brd=ok?'#86efac':warn?'#fcd34d':'#fca5a5';
    return e('div',{style:{background:bg,border:`1.5px solid ${brd}`,borderRadius:10,padding:'12px 16px',marginTop:10}},
      e('div',{style:{display:'flex',gap:10,alignItems:'flex-start'}},
        e('span',{style:{...mono,fontSize:16,color:col,flexShrink:0}},ok?'✓':warn?'⚠':'✗'),
        e('div',{style:{flex:1}},
          e('p',{style:{fontSize:12,color:col,marginBottom:10,fontWeight:500}},
            ok?`Koncentration ${r.conc} mg/ml — dosis OK`
            :warn?`Koncentration ${r.conc} mg/ml — afvigelse ${r.diff.toFixed(2)} mg (afrunding)`
            :`Koncentration ${r.conc} mg/ml — afvigelse ${r.diff.toFixed(2)} mg, tjek dine tal`
          ),
          e('div',{style:{display:'flex',gap:20}},
            ...[ ['SMID UD',`${r.discard.toFixed(1)} ml`],['DRIK',`${r.drink.toFixed(1)} ml`],['DOSIS',`${r.actual.toFixed(2)} mg`] ]
              .map(([label,val])=>e('div',{key:label},
                e('p',{style:{...mono,fontSize:10,color:col,opacity:0.7,marginBottom:3}},label),
                e('p',{style:{...mono,fontSize:22,color:col,fontWeight:700}},val)
              ))
          )
        )
      )
    );
  }

  // MILESTONE OVERLAY
  const MilestoneOverlay = milestone && e('div',{className:'milestone-overlay',onClick:()=>setMilestone(null)},
    e('div',{className:'milestone-card',style:{background:T.cardBg,border:`1.5px solid ${T.cardBorder}`,borderRadius:20,padding:28,maxWidth:400,width:'100%'},onClick:ev=>ev.stopPropagation()},

        e('p',{style:{fontSize:48,marginBottom:10}},milestone.icon),
        e('h2',{style:{fontFamily:"'Playfair Display', serif",fontSize:22,fontWeight:700,color:T.accentDark,marginBottom:6}},milestone.title),
        e('p',{style:{fontSize:14,color:T.textMuted}},milestone.sub)
      ),
      e('div',{style:{background:T.subBg,border:`1px solid ${T.subBorder}`,borderRadius:12,padding:'14px 16px',marginBottom:12}},

      ),
      e('div',{style:{background:T.progressBg,borderRadius:10,padding:'12px 14px',marginBottom:20}},
        e('p',{style:{...mono,fontSize:10,color:T.textSub,letterSpacing:'0.1em',textTransform:'uppercase',marginBottom:4}},'Tilbagekig'),

  // SETTINGS SHEET
  const SettingsSheet = showSettings && e('div',{className:'overlay',onClick:()=>setShowSettings(false)},

          .map(([key,label,sub])=>

          e('div',null,

            e('div',{style:{display:'flex',alignItems:'baseline',gap:6}},
              e('span',{style:{fontFamily:"'Playfair Display', serif",fontSize:52,fontWeight:700,color:T.accentDark,lineHeight:1}},todayDose?.toFixed(2)),
              e('span',{style:{...mono,fontSize:16,color:T.accent}},'mg')
            )
          ),
          e('button',{onClick:()=>toggle(todayIdx),
            style:{width:56,height:56,borderRadius:14,
              border:checked[phase]?.[todayIdx]?'none':`2px solid ${T.dotBorder}`,
              background:checked[phase]?.[todayIdx]?T.accent:T.progressBg,
              color:checked[phase]?.[todayIdx]?'#fff':T.textSub,
              fontSize:24,display:'flex',alignItems:'center',justifyContent:'center'}},
            checked[phase]?.[todayIdx]?'✓':'○')
        ),

        // Stamopløsning card
        e('div',{style:{background:T.cardBg,border:`1.5px solid ${T.cardBorder}`,borderRadius:12,overflow:'hidden',marginBottom:4,boxShadow:'0 1px 4px rgba(0,0,0,0.06)'}},
          e('div',{style:{padding:'10px 16px',borderBottom:`1px solid ${T.subBorder}`,background:T.subBg}},
            e('span',{style:{...mono,fontSize:10,color:T.textSub,letterSpacing:'0.12em',textTransform:'uppercase'}},'Stamopløsning')
          ),
          e('div',{style:{padding:'14px 16px',display:'flex',flexDirection:'column',gap:12}},
            // Tablet with lock
            e('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center'}},
              e('div',null,
                e('p',{style:{fontSize:14,color:T.text}},'Tablet (mg)'),
                
              ),
              e('div',{style:{display:'flex',alignItems:'center',gap:6}},
                tabletLocked
                  ? e('div',{style:{...mono,fontSize:20,fontWeight:600,color:T.textMuted,background:T.progressBg,border:`1.5px solid ${T.cardBorder}`,borderRadius:8,padding:'10px 14px',minWidth:80,textAlign:'right'}},`${tabletMg} mg`)
                  : e('input',{className:'num-input',type:'number',step:'0.5',min:'0.5',value:tabletMg,
                      style:{background:T.inputBg,borderColor:'#f59e0b',color:T.accentDark,width:90},
                      onChange:ev=>setTabletMg(ev.target.value)}),
                e('button',{onClick:()=>setTabletLocked(l=>!l),
                  style:{width:36,height:36,borderRadius:8,border:`1.5px solid ${tabletLocked?T.cardBorder:'#f59e0b'}`,
                    background:tabletLocked?T.progressBg:'#fef3c7',fontSize:16,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}},
                  tabletLocked?'🔒':'🔓')
              )
            ),
            e(Divider),
            // Water
            e('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center'}},
              e('div',null,
                e('label',{style:{fontSize:14,color:T.text,display:'block'}},'Vand (ml)'),
                e('p',{style:{...mono,fontSize:10,color:T.textSub,marginTop:2}},`Forslag: ${interval.suggestedWater} ml`)
              ),
              e('input',{className:'num-input',type:'number',step:'25',min:'0',value:waterMl,
                style:{background:T.inputBg,borderColor:T.inputBorder,color:T.accentDark},
                onChange:ev=>setWaterMl(ev.target.value)})
            )
          )
        ),

        todayDose&&e(VerifyBox,{targetDose:todayDose,tabletMg:tMg,waterMl:wMl}),

        // Phase progress
        e('div',{style:{background:T.cardBg,border:`1.5px solid ${T.cardBorder}`,borderRadius:10,padding:'12px 16px',marginTop:12}},
          e('div',{style:{display:'flex',justifyContent:'space-between',marginBottom:8,fontSize:12,color:T.textMuted,...mono}},
            e('span',null,`Fase ${phase+1} fremgang`),
            e('span',null,`${checkedInPhase}/${DAYS} dage`)
          ),
          e('div',{style:{height:6,background:T.progressBg,borderRadius:3,overflow:'hidden'}},
            e('div',{style:{width:`${(checkedInPhase/DAYS)*100}%`,height:'100%',background:T.accent,borderRadius:3,transition:'width 0.4s'}})
          )
        )
      );

  // CURVE TAB
  const CurveTab = e('div',null,
    e('div',{style:{background:T.cardBg,border:`1.5px solid ${T.cardBorder}`,borderRadius:12,padding:'16px 16px 12px',marginBottom:12,boxShadow:'0 1px 4px rgba(0,0,0,0.06)'}},
      e('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}},
        e('p',{style:{...mono,fontSize:10,color:T.textSub,letterSpacing:'0.12em',textTransform:'uppercase'}},'Nedtrapningskurve'),
        e('p',{style:{...mono,fontSize:10,color:T.textFaint}},startDate?`Start: ${new Date(startDate).toLocaleDateString('da-DK',{day:'numeric',month:'short',year:'numeric'})}` : 'Sæt startdato i indstillinger')
      ),
      e(TaperCurve,{checked,startDate,T}),
      e('div',{style:{display:'flex',gap:16,marginTop:8}},
        e('div',{style:{display:'flex',alignItems:'center',gap:5}},
          e('div',{style:{width:20,height:2.5,background:T.chartLine,borderRadius:2}}),
          e('span',{style:{...mono,fontSize:9,color:T.textFaint}},'Gennemført')
        ),
        e('div',{style:{display:'flex',alignItems:'center',gap:5}},
          e('div',{style:{width:20,height:2,borderTop:`2px dashed ${T.chartFuture}`,borderRadius:2}}),
          e('span',{style:{...mono,fontSize:9,color:T.textFaint}},'Fremskrivning')
        ),

      )
    ),
    // Stats
    e('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}},
      ...[
        ['Dage i alt',`${totalDone}`],
        ['Nuværende dosis', todayDose != null ? `${todayDose.toFixed(2)} mg` : `${interval.to} mg`],
        ['Reduceret', todayDose != null ? `${(25-todayDose).toFixed(2)} mg` : `${(25-interval.to).toFixed(2)} mg`],
        ['Tilbage', todayDose != null ? `${todayDose.toFixed(2)} mg` : `${interval.to.toFixed(2)} mg`],
      ].map(([label,val])=>
        e('div',{key:label,style:{background:T.cardBg,border:`1.5px solid ${T.cardBorder}`,borderRadius:10,padding:'12px 14px'}},

    ),

          ),
          e('div',{style:{height:4,background:T.progressBg,borderRadius:2,overflow:'hidden'}},
            e('div',{style:{width:`${pct}%`,height:'100%',background:complete?T.accentLight:T.accent,borderRadius:2}})
          )
        )
      );
    })
  );

  return e('div',{style:{background:T.bg,minHeight:'100vh'}},
    ConfettiCanvas,
    MilestoneOverlay,
    SettingsSheet,
    Header, Tabs,
    e('div',{style:{maxWidth:480,margin:'14px auto 0',padding:'0 24px'}},
      tab==='today'    && TodayTab,
      tab==='list'     && ListTab,
      tab==='curve'    && CurveTab,
      tab==='overview' && OverviewTab
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(e(App));
</script>
</body>
</html>
